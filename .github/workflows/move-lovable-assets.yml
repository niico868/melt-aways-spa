name: Move images off Lovable

# Run by hand from the Actions tab. Downloads the site's images from the live
# Lovable site into public/media and commits them, so Cloudflare can serve them.
on:
  workflow_dispatch:
    inputs:
      source_site:
        description: "Live site to copy the images from (still hosted on Lovable)"
        default: "https://meltawaysspa.com"
        required: true

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download images and update paths
        run: python3 scripts/move-lovable-assets.py "${{ inputs.source_site }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/media src/assets
          if git diff --cached --quiet; then
            echo "Nothing to commit - images already moved."
          else
            git commit -m "Move site images from Lovable hosting into public/media"
            git push
          fi
